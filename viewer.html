<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title> Ville de Longueuil</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css"/>
<style>
  html, body {   margin: 0;
    height: 100%;
    background-image: url("DJI_0639.JPG");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    }

  .home-link { position: absolute; top: 16px; left: 16px; z-index: 60; font: 600 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .home-link a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; background: rgba(0,0,0,.45); }
  .home-link a:hover { background: rgba(0,0,0,.65); }
  .banner {
    position: absolute; top: 0; left: 0; right: 0;
    background: #b91c1c; color: #fff; padding: 10px 14px;
    font: 500 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display: none; z-index: 80;
  }
  .banner.show { display: block; }
  .start { position: absolute; inset: 0; display:grid; place-items:center; z-index:70; background: radial-gradient(1200px 600px at 50% 40%, rgba(255,255,255,0.06), rgba(0,0,0,0.85)); }
  .start .card { text-align:center; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding:24px 28px; border-radius:16px; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); border:1px solid rgba(255,255,255,.15); }
  .start h1 { margin:.2em 0 .4em; font-size: clamp(22px, 4vw, 34px); }
  .start p { margin:.2em 0 1em; color:#e5e7eb; font-size: 14px; }
  .btn { display:inline-block; padding:12px 16px; border-radius:12px; background:#2563eb; color:#fff; text-decoration:none; font-weight:700; border:0; cursor:pointer; }
  .btn:active{ transform: translateY(1px); }

  .scenes-bar{
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 65; flex-wrap: wrap; justify-content: center;
    background: rgba(0,0,0,.35); padding: 10px; border-radius: 12px; backdrop-filter: blur(6px);
  }
  .scene-btn{ padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35); color:#fff; cursor:pointer; font:600 13px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .scene-btn[aria-current="true"]{ outline:2px solid #93c5fd; background: rgba(37,99,235,.6); }
  viewer { width: 100%; height: 100%; display:none; }
  logo { position: absolute; bottom: 32px; right: 32px; z-index: 50; }
  logo img { height: 120px; width: auto; }
</style>
</head>
<body>
  <div class="home-link"><a href="index.html" aria-label="Retour à l'accueil">← Accueil</a></div>

  <nav class="scenes-bar" id="scenesBar" aria-label="Sélection de scènes"></nav>

  <div id="logo">
    <a href="i.ico" target="_blank" rel="noopener">
      <img src="i.ico" alt="Ville de Longueuil">
    </a>
  </div>

  <div id="viewer" role="application" aria-label="Visionneur panoramique 360"></div>
  <div id="banner" class="banner" role="alert"></div>

  <div class="start" id="start">
    <div class="card">
      <h1>Visite 360°</h1>
      <p>Cliquez sur un bouton de périmètre ou sur « Commencer » pour charger la scène 360.</p>
      <button id="startBtn" class="btn" type="button">Commencer</button>
    </div>
  </div>

<script>
(function () {
  const banner = document.getElementById('banner');
  const start = document.getElementById('start');
  const startBtn = document.getElementById('startBtn');
  const viewerDiv = document.getElementById('viewer');
  const scenesBar = document.getElementById('scenesBar');
  let viewer = null;

  function showError(msg) {
    banner.textContent = msg;
    banner.classList.add('show');
    console.error(msg);
  }

  if (!window.pannellum) {
    showError("Erreur: bibliothèque Pannellum introuvable. Vérifiez la connexion Internet et le CDN.");
    return;
  }

  
  const scenes = {
    "scene1": { title: "Parc à Longueuil", panorama: "DJI_0617.JPG" },
    "scene2": { title: "Longueuil & cie",  panorama: "DJI_0624.JPG" },
    "scene3": { title: "Longueuil en 360",  panorama: "DJI_0625.JPG" },
    "scene4": { title: "Coupe Longueuil",  panorama: "DJI_0627.JPG" },
    "scene5": { title: "Oeil-Long",  panorama: "DJI_0628.JPG" },
  };

  function getSceneFromQuery() {
    const p = new URLSearchParams(window.location.search);
    const s = p.get('scene');
    return (s && scenes[s]) ? s : 'scene1';
  }


  const config = {
    "default": {
      firstScene: getSceneFromQuery(),
      autoLoad: true,
      sceneFadeDuration: 1000
    },
    scenes: {}
  };
  for (const [key, val] of Object.entries(scenes)) {
    config.scenes[key] = {
      title: val.title,
      panorama: val.panorama,
      type: 'equirectangular'
    };
  }

  function buildScenesButtons(activeKey){
    scenesBar.innerHTML = '';
    for (const [key, val] of Object.entries(scenes)){
      const btn = document.createElement('button');
      btn.className = 'scene-btn';
      btn.textContent = val.title;
      btn.setAttribute('data-scene', key);
      btn.setAttribute('aria-current', String(key === activeKey));
      scenesBar.appendChild(btn);
    }
  }

  function setQueryScene(key){
    const url = new URL(window.location.href);
    url.searchParams.set('scene', key);
    window.history.pushState({}, '', url);
  }

  function goToScene(key){
    if (!scenes[key]) return;
    if (!viewer){ initViewer(key); return; }
    viewer.loadScene(key);
    highlightActive(key);
    setQueryScene(key);
  }

  function highlightActive(key){
    document.querySelectorAll('.scene-btn').forEach(b => {
      b.setAttribute('aria-current', String(b.dataset.scene === key));
    });
  }

  function initViewer(forceFirstScene){
    try {
      viewerDiv.style.display = 'block';
      if (!config.default.firstScene || forceFirstScene){
        config.default.firstScene = forceFirstScene || getSceneFromQuery();
      }
      viewer = pannellum.viewer('viewer', config);
      start.remove();
      buildScenesButtons(config.default.firstScene);
      highlightActive(config.default.firstScene);
    } catch (e) {
      showError('Erreur lors de l\'initialisation du visionneur: ' + e.message);
    }
  }


  scenesBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.scene-btn');
    if(!btn) return;
    const key = btn.getAttribute('data-scene');
    goToScene(key);
  });

  buildScenesButtons(getSceneFromQuery());

  startBtn.addEventListener('click', () => initViewer());


  window.addEventListener('popstate', () => {
    const key = getSceneFromQuery();
    if (viewer && scenes[key] && viewer.getScene() !== key){
      viewer.loadScene(key);
      highlightActive(key);
    }
  });
})();
</script>
</body>
</html>
