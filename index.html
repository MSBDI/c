<!doctype html> 
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo de la ville de Longueuil </title>
<meta name="description" content="360∘ à Longueuil">
 <style>
 :root { --bg:#002b5c; --fg:#002b5c; --muted:#002b5c; --accent:#002b5c; --card:#002b5c; --btn:#4f8cff; --btn-fg:#fff;}
 html,body { height:100%;}
 body {
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
  background: url("DJI_0663.JPG") no-repeat center center fixed;
  background-size: cover;
  color: var(--fg);}
 .wrap{ max-width:1400px; margin:0 auto; padding:32px 20px 40px; }
 .hero{ display:grid; gap:10px;}
h1{text-align: center; margin:0; font-size: clamp(34px, 5vw, 54px);
   letter-spacing:.3px; color:var(--fg);}
 .lead{text-align: center; margin:0; color:var(--muted); font-size: clamp(18px, 2.5vw, 22px);}
 .cta{text-align: center; margin-top:22px;}
 .btn{
  display:inline-block; padding:16px 22px;
  background:var(--btn); color:var(--btn-fg);
  text-decoration:none; border-radius:14px; font-weight:600;
  font-size:18px;
  box-shadow: 0 8px 24px rgba(79,140,255,.25);
  transition: transform .08s ease;}
 .btn:active{ transform: translateY(1px);}
 .panel{
  margin-top:30px;
  background:transparent; border:0; border-radius:0;
  padding:0; height:fit-content;}
.viewer{
  width:100%;
  height:90vh;
  max-height:100dvh;
  min-height:500px;
  border:0;
  display:block;
  font-size:18px; 
  color: var(--fg);}
 .fineprint{ margin-top:12px; font-size:48px; color:var(--muted);}
@media (max-width:640px){ .panel{ padding:10px; } }
</style>
</head>
<body>

</body>
</html>
